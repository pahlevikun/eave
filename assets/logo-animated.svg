<svg xmlns="http://www.w3.org/2000/svg" width="904" height="256" viewBox="0 0 904 256" fill="none" role="img" aria-labelledby="title description"><title id="title">Eave — Scripts in your menu bar.</title><desc id="description">Original brand mark and an illustrative product card. Static artwork remains visible when CSS animation is unsupported.</desc><defs><style>.draw{stroke-dasharray:1000;animation:draw 6s ease-in-out infinite}.story-row{animation:row 6s ease-in-out infinite}.story-row.two{animation-name:rowtwo}@keyframes row{0%,12%{opacity:.45;transform:translateY(4px)}38%,88%{opacity:1;transform:translateY(0)}100%{opacity:.45;transform:translateY(4px)}}@keyframes rowtwo{0%,22%{opacity:.45;transform:translateY(4px)}48%,88%{opacity:1;transform:translateY(0)}100%{opacity:.45;transform:translateY(4px)}}@keyframes draw{0%,7%{stroke-dashoffset:1000}38%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1000}}@media(prefers-reduced-motion:reduce){.draw, .story-row{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style></defs><rect width="904" height="256" rx="20" fill="#171815"/><rect x=".75" y=".75" width="902.5" height="254.5" rx="19.25" stroke="#3b3e34" stroke-width="1.5"/><rect x="28" y="60" width="136" height="136" rx="30" fill="#23251f"/><g transform="translate(28 60) scale(.265625)"><path fill="none" class="draw roof" d="M132 190 L256 126 L380 190 H164 V346 H348" stroke="#f0b45b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" class="draw cross" d="M164 268 H300" stroke="#f0b45b" stroke-width="30" stroke-linecap="round"/></g><text x="184" y="103" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f4f1e9" letter-spacing="-1.2">Eave</text><text x="186" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#b9b8ad" >Scripts in your menu bar.</text><rect x="186" y="151" width="68" height="27" rx="13.5" fill="#2d3028"/><text x="202" y="169" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#f0b45b" >macOS</text><rect x="262" y="151" width="83" height="27" rx="13.5" fill="#2d3028"/><text x="278" y="169" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#f0b45b" >Scripts</text><text x="186" y="205" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#969b8b" >Small scripts. A useful menu bar.</text><g transform="translate(456 22)"><rect width="424" height="212" rx="14" fill="#23251f" stroke="#3b3e34"/><text x="20" y="28" font-family="Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#b9b8ad" letter-spacing="1">MENU BAR SCRIPTS</text><rect x="20" y="44" width="384" height="38" rx="9" fill="#171815"/><path fill="none" d="M38 64 H55 M67 64 H98" stroke="#969b8b" stroke-width="3" stroke-linecap="round"/><circle cx="314" cy="63" r="4" fill="#f0b45b"/><text x="328" y="68" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#f4f1e9" >Eave</text><g class="story-row one"><rect x="20" y="100" width="34" height="34" rx="9" fill="#2d3028"/><path fill="none" d="M32 111 L38 117 L32 123" stroke="#f0b45b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="113" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#f4f1e9" >clock.5s.sh</text><text x="66" y="131" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#b9b8ad" >Time, at a glance</text></g><g class="story-row two"><rect x="20" y="149" width="34" height="34" rx="9" fill="#2d3028"/><path fill="none" d="M32 160 L38 166 L32 172" stroke="#f0b45b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="162" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#f4f1e9" >focus.1m.sh</text><text x="66" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#b9b8ad" >Your script. Your status.</text></g></g></svg>
